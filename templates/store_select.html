<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Picker Hunt — Seleccionar Tienda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { walmart: { blue: '#0053e2', spark: '#ffc220' } } } }
    }
  </script>
</head>
<body class="min-h-screen bg-walmart-blue flex items-center justify-center p-4">
  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="text-center mb-10">
      <div class="text-6xl font-black text-walmart-spark mb-3">PH</div>
      <h1 class="text-3xl font-black text-white">Picker Hunt</h1>
      <p class="text-blue-200 text-sm mt-1">Plataforma colaborativa en tiempo real</p>
    </div>

    <!-- Store selector card -->
    <div class="bg-white rounded-2xl shadow-2xl p-6">
      <h2 class="text-center text-lg font-black text-gray-700 mb-1">A que tienda perteneces?</h2>
      <p class="text-center text-xs text-gray-400 mb-6">Selecciona tu local para continuar</p>

      <div class="flex flex-col gap-4">

        <!-- Local 929 -->
        <a href="/login?store=929"
           class="flex items-center gap-4 bg-walmart-blue hover:bg-blue-700 text-white
                  rounded-xl px-5 py-4 transition font-bold text-left shadow-md
                  focus:outline-none focus:ring-4 focus:ring-blue-300"
           aria-label="Ingresar al Local 929">
          <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center shrink-0">
            <span class="font-black text-sm">929</span>
          </div>
          <div>
            <div class="text-lg font-black">Local 929</div>
            <div class="text-xs text-blue-200 font-normal">Supercenter</div>
          </div>
          <span class="ml-auto font-black text-xl">&rsaquo;</span>
        </a>

        <!-- Local 96 -->
        <a href="/login?store=96"
           class="flex items-center gap-4 bg-walmart-spark hover:bg-yellow-400 text-gray-900
                  rounded-xl px-5 py-4 transition font-bold text-left shadow-md
                  focus:outline-none focus:ring-4 focus:ring-yellow-300"
           aria-label="Ingresar al Local 96">
          <div class="w-10 h-10 rounded-full bg-black/10 flex items-center justify-center shrink-0">
            <span class="font-black text-sm">96</span>
          </div>
          <div>
            <div class="text-lg font-black">Local 96</div>
            <div class="text-xs text-yellow-800 font-normal">Supercenter</div>
          </div>
          <span class="ml-auto font-black text-xl">&rsaquo;</span>
        </a>

      </div>

      <p class="text-center text-xs text-gray-400 mt-6">
        Picker Hunt &copy; 2025 &middot; Walmart
      </p>
    </div>
  </div>
</body>
</html>
